<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Batman Pet</title>
    <link rel="stylesheet" href="pet.css">
  </head>
  <body>
    <main id="stage" class="stage leaving">
      <section id="bubble" class="bubble hidden"></section>
      <section id="chat" class="chat hidden">
        <header>
          <strong>Batman</strong>
          <button id="closeChat" aria-label="Close chat">x</button>
        </header>
        <div id="messages" class="messages"></div>
        <form id="chatForm">
          <input id="chatInput" autocomplete="off" placeholder="Talk to Batman">
          <button type="submit">Send</button>
        </form>
      </section>
      <button id="petButton" class="pet" aria-label="Open pet chat">
        <img src="../../assets/pet.svg" alt="">
      </button>
    </main>
    <script src="pet.js"></script>
  </body>
</html>
